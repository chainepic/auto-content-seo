# ============================================================
# Auto Content SEO - 配置文件
# 
# 使用方法：
#   1. 复制本文件为 config.yml
#   2. 按照下方注释填入你的信息
#   3. 运行 npm run start -- run
#
# 提示：所有 ${ENV_VAR} 格式的值会自动从 .env 文件或系统环境变量读取
#       你也可以直接填写明文值（不推荐，避免泄露密钥）
# ============================================================


# ──────────────────────────────────
# 项目基本信息
# ──────────────────────────────────
project:
  name: "My Tech Blog"              # 你的博客/站点名称（AI 写文章时会引用）
  domain: "https://example.com"      # 你的站点域名（用于生成 Sitemap 和 SEO 链接）
  locale: "zh-CN"                    # 系统主语言：zh-CN | en | ja | ...


# ──────────────────────────────────
# 博客内容规则
# ──────────────────────────────────
blog:
  # AI 可选的文章分类（你的网站有哪些栏目就写哪些）
  categories:
    - "tech"
    - "tutorial"
    - "news"

  # AI 写作的语气风格
  tone: "专业、客观、有深度"

  # 禁止出现的关键词或话题（AI 选题时会主动避开）
  forbidden_keywords:
    - "敏感词示例"


# ──────────────────────────────────
# 大模型配置
# ──────────────────────────────────
models:
  # --- 文本模型（写文章 + 翻译） ---
  text:
    # 可选值: deepseek | openai | claude | qwen
    provider: "deepseek"

    # API 密钥（推荐放在 .env 文件中，这里用 ${} 引用）
    api_key: "${DEEPSEEK_API_KEY}"

    # 具体模型名称
    model: "deepseek-chat"

    # 自定义 API 地址（可选，默认使用官方地址）
    # base_url: "https://api.deepseek.com/chat/completions"

  # --- 图像模型（生成封面配图，可选） ---
  # 如果不需要自动生成封面图，可以把下面整块删掉或注释掉
  image:
    # 可选值: wanx | dall-e
    provider: "wanx"
    api_key: "${DASHSCOPE_API_KEY}"


# ──────────────────────────────────
# 文章输出目标（存到哪里）
# ──────────────────────────────────
output:
  # 可选值: markdown | supabase | mysql | sqlite
  #
  # markdown  → 最简单，生成 .md 文件到本地文件夹，适配 Hexo/Hugo/Astro
  # supabase  → 直接写入 Supabase 云端 PostgreSQL 数据库
  # mysql     → 写入你自建的 MySQL 数据库（即将支持）
  # sqlite    → 写入本地 SQLite 文件（即将支持）
  type: "markdown"

  # --- Markdown 模式专用 ---
  markdown_dir: "./output_articles"   # 文章输出目录

  # --- Supabase 模式专用（取消注释即可启用） ---
  # type: "supabase"
  # supabase_url: "${SUPABASE_URL}"
  # supabase_key: "${SUPABASE_SERVICE_KEY}"

  # --- MySQL 模式专用（即将支持） ---
  # type: "mysql"
  # db_host: "localhost"
  # db_user: "root"
  # db_pass: "${DB_PASSWORD}"
  # db_name: "my_blog"


# ──────────────────────────────────
# 发布通知（可选）
# 
# 文章发布成功后自动推送通知，
# 不需要的渠道设 enabled: false 即可
# ──────────────────────────────────
notifications:
  # Telegram Bot 通知
  telegram:
    enabled: false
    bot_token: "${TG_BOT_TOKEN}"      # 从 @BotFather 获取
    chat_id: "${TG_CHAT_ID}"          # 你的聊天 ID 或群组 ID

  # Discord Webhook 通知
  discord:
    enabled: false
    webhook_url: "${DISCORD_WEBHOOK_URL}"

  # Email 通知（即将支持）
  # email:
  #   enabled: false
  #   smtp_host: "smtp.gmail.com"
  #   smtp_port: 587
  #   smtp_user: "you@gmail.com"
  #   smtp_pass: "${SMTP_PASSWORD}"
  #   to: "notify@example.com"
